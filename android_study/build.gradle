import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'org.jetbrains.kotlin.plugin.serialization' version "${kotlin_version}"
    id 'org.jetbrains.kotlin.kapt'
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' version "${kotlin_version}"
    id 'com.google.dagger.hilt.android' version "${dagger_version}"
}

kapt {
    correctErrorTypes = true
    javacOptions {
        option("-Adagger.hilt.android.internal.disableAndroidSuperclassValidation=true")
    }
}

android {
    compileSdk 35
    defaultConfig {
        applicationId "com.example.vladislav.androidstudy"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true
        signingConfig signingConfigs.debug

        buildConfigField("String", "API_KEY", API_KEY)
        buildConfigField("String", "API_BASE_URL", API_BASE_URL)
        vectorDrawables {
            useSupportLibrary true
        }
        kotlinOptions {
            freeCompilerArgs += [
                    "-P", "plugin:androidx.compose.compiler.plugins.kotlin:sourceInformation=true"
            ]
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
            matchingFallbacks = ['debug']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    namespace 'com.example.vladislav.androidstudy'
    buildFeatures {
        compose true
        buildConfig = true
    }
    packaging {
        resources {
            // Явно приказываем сборщику сохранять маркерные файлы Jetpack Compose
            pickFirsts += "META-INF/androidx.compose.ui_ui.version"
            pickFirsts += "META-INF/*.version"
        }
    }
    sourceSets {
        debug {
            // Явно заставляем Gradle брать ресурсы из дебаг папки
            resources.srcDirs += ['src/debug/resources']
        }
    }
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlinx:kotlinx-serialization-core:${serialization_json_version}"
    }
}

dependencies {
    // Compose BOM (единый источник согласованных версий Compose)
    implementation platform("androidx.compose:compose-bom:${compose_bom_version}")
    androidTestImplementation platform("androidx.compose:compose-bom:${compose_bom_version}")

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"

    // AndroidX & Core
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity-compose:$activity_compose_version"
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation "androidx.constraintlayout:constraintlayout:$constraintlayout_version"
    implementation "androidx.core:core-ktx:$core_ktx_version"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation "com.google.android.material:material:$material_version"

    // Network & Serialization
    implementation "com.android.volley:volley:$volley_version"
    implementation('org.simpleframework:simple-xml:2.7.1') {
        exclude module: 'stax'
        exclude module: 'stax-api'
        exclude module: 'xpp3'
    }
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"
    implementation "com.squareup.retrofit2:adapter-rxjava2:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"

    // RxJava & Coroutines & Kotlin
    implementation "io.reactivex.rxjava2:rxandroid:$rxandroid_version"
    implementation "io.reactivex.rxjava2:rxjava:$rxjava2_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.5'
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:${serialization_json_version}") {
        exclude group: 'org.jetbrains.kotlinx', module: 'kotlinx-serialization-bom'
    }

    // DI (Dagger / Hilt)
    implementation "com.google.dagger:dagger:$dagger_version"
    implementation "com.google.dagger:hilt-android:$dagger_version"
    kapt "com.google.dagger:hilt-compiler:$dagger_version"
    kapt "com.google.dagger:dagger-compiler:$dagger_version"

    // Moxy
    implementation "com.github.moxy-community:moxy:$moxy_version"
    implementation "com.github.moxy-community:moxy-androidx:$moxy_version"
    implementation "com.github.moxy-community:moxy-ktx:$moxy_version"
    kapt "com.github.moxy-community:moxy-compiler:$moxy_version"

    // Project modules
    implementation project(':AnalyticsLibApi')

    // Tests
    testImplementation "junit:junit:$junit_version"
    androidTestImplementation "androidx.test:core:1.1.0"
    androidTestImplementation "androidx.test.ext:junit:$junit_ext_version"
    androidTestImplementation("androidx.test.espresso:espresso-core:$espresso_version", {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
}

tasks.withType(KotlinCompile).configureEach {
    def isReportEnabled = project.findProperty("composeCompilerReports") == "true"
    if (isReportEnabled) {
        kotlinOptions {
            freeCompilerArgs += [
                    "-P", "plugin:androidx.compose.compiler.plugins.kotlin:sourceInformation=true"
            ]
            freeCompilerArgs += [
                    "-P", "plugin:androidx.compose.compiler.plugins.kotlin:metricsDestination=${project.layout.buildDirectory.dir("compose_metrics").get().asFile.absolutePath}",
                    "-P", "plugin:androidx.compose.compiler.plugins.kotlin:reportsDestination=${project.layout.buildDirectory.dir("compose_compiler").get().asFile.absolutePath}"
            ]
        }
    }
}
